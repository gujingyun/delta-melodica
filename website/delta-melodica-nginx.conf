# 三角洲口风琴静态介绍页，挂载在现有站点的独立路径下。
location = /melodica {
    return 301 /melodica/;
}

location = /melodica/admin {
    return 301 /melodica/admin/;
}

location /melodica/admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /melodica/admin/index.html;
    auth_basic "三角洲口风琴统计后台";
    auth_basic_user_file /etc/nginx/.htpasswd-melodica;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /melodica/admin-api/ {
    client_max_body_size 11m;
    access_log off;
    auth_basic "三角洲口风琴曲库后台";
    auth_basic_user_file /etc/nginx/.htpasswd-melodica;
    proxy_pass http://127.0.0.1:3004/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /melodica/api/stats {
    auth_basic "三角洲口风琴统计后台";
    auth_basic_user_file /etc/nginx/.htpasswd-melodica;
    proxy_pass http://127.0.0.1:3002/stats;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
}

location /melodica/account-api/ {
    client_max_body_size 2m;
    access_log off;
    proxy_pass http://127.0.0.1:3003/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /melodica/account/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

location /melodica/api/ {
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}

location /melodica/downloads/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /melodica/version.json {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /melodica/songs/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /melodica/videos/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /melodica/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /melodica/index.html;
    add_header X-Content-Type-Options "nosniff" always;
}
